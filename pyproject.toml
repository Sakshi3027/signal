[project]
name = "signal-workspace"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "langsmith>=0.8.9",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.29",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "python-dotenv>=1.0",
  "numpy>=2.4.6",
  "pandas>=3.0.3",
  "dbt-duckdb>=1.8",
]
