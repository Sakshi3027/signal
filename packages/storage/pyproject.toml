[project]
name = "signal-storage"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "psycopg2-binary>=2.9",
  "sqlalchemy>=2.0",
  "qdrant-client>=1.9",
  "sentence-transformers>=3.0",
  "duckdb>=1.2",
  "python-dotenv>=1.0",
  "loguru>=0.7",
  "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/storage"]