[project]
name = "signal-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "dlt[duckdb]>=1.9",
  "duckdb>=1.2",
  "feedparser>=6.0",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "tenacity>=8.0",
  "loguru>=0.7",
  "pydantic>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion"]