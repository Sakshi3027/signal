services:
  postgres:
    image: postgres:16-alpine
    container_name: signal-postgres
    environment:
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal123
      POSTGRES_DB: signal
    ports:
      - "5432:5432"
    volumes:
      - signal_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: signal-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - signal_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  signal_postgres_data:
  signal_qdrant_data: